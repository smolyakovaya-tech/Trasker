<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Трекер Яны — Моё утро 7:30</title>
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #8e8e93;
            --accent: #ff9500;
            --accent-dark: #e68600;
            --border: #e5e5ea;
            --done: #34c759;
            --miss: #ff3b30;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 20px;
            --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 100px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .container { max-width: 480px; margin: 0 auto; }

        .header {
            text-align: center;
            padding: 20px 0 12px;
        }
        .header .icon { font-size: 42px; margin-bottom: 6px; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
        .header .subtitle { color: var(--sub); font-size: 14px; font-weight: 500; margin-top: 2px; }

        .streak-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin: 12px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .streak-card .days {
            font-size: 40px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -1px;
            line-height: 1;
        }
        .streak-card .label { font-size: 13px; color: var(--sub); font-weight: 500; }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 10px 4px;
        }

        .habit-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }
        .habit-card:active { transform: scale(0.985); }
        .habit-card.done {
            border-color: transparent;
            background: #f0faf2;
        }
        .habit-card.done .habit-check {
            background: var(--done);
            border-color: var(--done);
        }
        .habit-check {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #d1d1d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.25s;
            background: var(--card);
        }
        .habit-info { flex: 1; }
        .habit-info .name {
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.2px;
        }
        .habit-info .detail {
            font-size: 12px;
            color: var(--sub);
            margin-top: 2px;
        }
        .habit-card.done .habit-info .name {
            color: #1b5e20;
        }

        .notes-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .notes-card textarea {
            width: 100%;
            border: none;
            resize: vertical;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            background: transparent;
            outline: none;
            min-height: 70px;
            line-height: 1.5;
        }
        .notes-card textarea::placeholder { color: #c7c7cc; }

        .btn-row {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            letter-spacing: -0.2px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
        .btn-ghost {
            background: transparent;
            color: var(--sub);
            font-weight: 500;
            font-size: 13px;
            padding: 8px;
            text-decoration: underline;
            border: none;
            display: block;
            margin: 0 auto;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 99;
        }
        .toast.show { opacity: 1; }

        .footer { text-align: center; color: #c7c7cc; font-size: 11px; margin-top: 10px; }
        .reset-area { text-align: center; margin: 20px 0 0; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <div class="icon">🌅</div>
        <h1>Моё утро 7:30</h1>
        <div class="subtitle">Время для себя</div>
    </div>

    <!-- Streak -->
    <div class="streak-card">
        <div>
            <div class="label">Серия дней</div>
        </div>
        <div class="days" id="streakCount">0</div>
    </div>

    <!-- Habits -->
    <div class="section-title">🌿 Привычки на сегодня</div>
    <div id="habitList"></div>

    <!-- Notes -->
    <div class="section-title">📝 Заметки дня</div>
    <div class="notes-card">
        <textarea id="notesField" placeholder="Как я себя чувствую? Что получилось? Мысли, настроение..."></textarea>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Сохранить день</button>
        <button class="btn btn-secondary" id="exportBtn">📤 Отчёт</button>
    </div>

    <div class="reset-area">
        <button class="btn-ghost" id="resetAllBtn">Сбросить все данные</button>
    </div>

    <div class="footer">Трекер Яны • сохрани на рабочий стол</div>
    <div class="toast" id="toast"></div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'yana_habit_tracker_v1';
        const DEFAULT_HABITS = [
            { id: 'wake', name: 'Подъём в 7:30', detail: 'Время только для себя — без ребёнка и мужа', icon: '⏰' },
            { id: 'steps', name: '10 000 шагов', detail: 'Прогулка, САП или покос — любое движение', icon: '👣' },
            { id: 'read', name: '20 страниц книги', detail: 'Перед сном, вместо телефона', icon: '📖' },
            { id: 'silence', name: '15 минут тишины', detail: 'Без телефона, просто наблюдать', icon: '🧘' },
            { id: 'water', name: 'Водный режим', detail: '1.5–2 литра чистой воды', icon: '💧' },
            { id: 'protein', name: 'Белковый завтрак', detail: 'Яйца, творог или рыба', icon: '🍳' },
            { id: 'supps', name: 'Добавки', detail: 'Цинк, D3, Магний, Таурин, Теанин', icon: '💊' },
            { id: 'mood', name: 'Без жалоб и споров', detail: 'Замечаю, но не вовлекаюсь', icon: '😌' }
        ];

        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch(e) {}
            return { days: {} };
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        let appData = loadData();
        let today = getToday();
        let currentDay = appData.days[today] || { habits: {}, notes: '' };

        function renderAll() {
            renderHabits();
            renderNotes();
            updateStreak();
        }

        function renderHabits() {
            const container = document.getElementById('habitList');
            container.innerHTML = '';
            DEFAULT_HABITS.forEach(h => {
                const isDone = currentDay.habits[h.id] === true;
                const card = document.createElement('div');
                card.className = 'habit-card' + (isDone ? ' done' : '');
                card.innerHTML = `
                    <div class="habit-check">${isDone ? '✅' : h.icon}</div>
                    <div class="habit-info">
                        <div class="name">${h.name}</div>
                        <div class="detail">${h.detail}</div>
                    </div>
                `;
                card.addEventListener('click', () => toggleHabit(h.id));
                container.appendChild(card);
            });
        }

        function renderNotes() {
            document.getElementById('notesField').value = currentDay.notes || '';
        }

        function updateStreak() {
            let streak = 0;
            const d = new Date();
            for (let i = 0; i < 365; i++) {
                const check = new Date(d);
                check.setDate(d.getDate() - i);
                const key = `${check.getFullYear()}-${String(check.getMonth()+1).padStart(2,'0')}-${String(check.getDate()).padStart(2,'0')}`;
                const day = appData.days[key];
                if (day && day.habits) {
                    const doneCount = Object.values(day.habits).filter(v => v === true).length;
                    if (doneCount >= 1) {
                        streak++;
                        continue;
                    }
                }
                if (i === 0 && currentDay.habits && Object.values(currentDay.habits).filter(v=>v===true).length >= 1) {
                    streak++;
                    continue;
                }
                break;
            }
            document.getElementById('streakCount').textContent = streak;
        }

        function toggleHabit(id) {
            currentDay.habits[id] = !currentDay.habits[id];
            appData.days[today] = currentDay;
            saveData(appData);
            renderAll();
            showToast(currentDay.habits[id] ? '✅ Отмечено!' : 'Снято');
        }

        function saveDay() {
            currentDay.notes = document.getElementById('notesField').value.trim();
            appData.days[today] = currentDay;
            saveData(appData);
            renderAll();
            showToast('💾 День сохранён!');
        }

        function exportReport() {
            currentDay.notes = document.getElementById('notesField').value.trim();
            appData.days[today] = currentDay;
            saveData(appData);

            const report = [];
            const d = new Date();
            for (let i = 6; i >= 0; i--) {
                const check = new Date(d);
                check.setDate(d.getDate() - i);
                const key = `${check.getFullYear()}-${String(check.getMonth()+1).padStart(2,'0')}-${String(check.getDate()).padStart(2,'0')}`;
                const day = appData.days[key];
                const dateStr = check.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
                if (day) {
                    const done = Object.values(day.habits||{}).filter(v=>v===true).length;
                    report.push(`📅 ${dateStr} — ${done}/${DEFAULT_HABITS.length} привычек`);
                    if (day.notes) report.push(`   📝 ${day.notes}`);
                } else {
                    report.push(`📅 ${dateStr} — нет данных`);
                }
            }

            const streak = document.getElementById('streakCount').textContent;
            const header = `🌅 Отчёт Яны — неделя\n🔥 Серия: ${streak} дней\n━━━━━━━━━━━━━━━\n`;
            const full = header + report.join('\n') + `\n━━━━━━━━━━━━━━━\n✨ Ты справляешься.`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(full).then(() => {
                    showToast('📋 Отчёт скопирован! Отправь его своему специалисту.');
                }).catch(() => {
                    downloadReport(full);
                });
            } else {
                downloadReport(full);
            }
        }

        function downloadReport(text) {
            const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `отчёт-яны-${today}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 Отчёт скачан!');
        }

        function resetAll() {
            if (confirm('Удалить ВСЕ данные трекера? Это нельзя отменить.')) {
                localStorage.removeItem(STORAGE_KEY);
                appData = { days: {} };
                currentDay = { habits: {}, notes: '' };
                renderAll();
                showToast('🗑 Все данные сброшены');
            }
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 2200);
        }

        document.getElementById('saveBtn').addEventListener('click', saveDay);
        document.getElementById('exportBtn').addEventListener('click', exportReport);
        document.getElementById('resetAllBtn').addEventListener('click', resetAll);
        document.getElementById('notesField').addEventListener('blur', () => {
            currentDay.notes = document.getElementById('notesField').value.trim();
            appData.days[today] = currentDay;
            saveData(appData);
        });

        if (!appData.days[today]) {
            currentDay = { habits: {}, notes: '' };
        }

        renderAll();
    })();
</script>
</body>
</html>
