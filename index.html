<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Трекер Яны</title>
    <style>
        :root {
            --bg-start: #1a1a2e;
            --bg-mid: #16213e;
            --bg-end: #0f3460;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.12);
            --glass-hover: rgba(255,255,255,0.14);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.65);
            --accent: #ff9f43;
            --accent-glow: rgba(255,159,67,0.3);
            --done: #2ed573;
            --done-glow: rgba(46,213,115,0.3);
            --blue: #54a0ff;
            --blue-glow: rgba(84,160,255,0.3);
            --radius: 24px;
            --radius-sm: 16px;
            --blur: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            min-height: 100vh;
            padding: 20px 16px 100px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            letter-spacing: -0.2px;
            transition: background 1.5s ease;
        }
        body.morning { background: linear-gradient(160deg, #1a1a2e 0%, #2d3561 30%, #ff7b54 80%, #ffb26b 100%); }
        body.day { background: linear-gradient(160deg, #0f2027 0%, #203a43 30%, #2c5364 60%, #54a0ff 100%); }
        body.evening { background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%); }
        .container { max-width: 440px; margin: 0 auto; }

        .header { text-align: center; padding: 10px 0 20px; }
        .header .icon { font-size: 38px; margin-bottom: 8px; }
        .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; }
        .header .time-theme { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .freedom-row, .streak-row { display: flex; align-items: center; justify-content: space-between; }
        .freedom-row .days-count {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #2ed573, #7bed9f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            line-height: 1;
        }
        .streak-row .days {
            font-size: 42px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -1px;
            line-height: 1;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .freedom-row .label, .streak-row .label { font-size: 15px; color: var(--text-secondary); font-weight: 500; }

        .calendar { display: flex; justify-content: space-between; align-items: center; gap: 0px; padding: 0 2px; }
        .calendar .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 6px 2px;
            border-radius: 18px;
            transition: all 0.2s ease;
            min-width: 36px;
            background: transparent;
        }
        .calendar .day-cell:active { transform: scale(0.93); }
        .calendar .day-cell.today { background: rgba(255,255,255,0.1); }
        .calendar .day-cell.selected { background: var(--glass-hover); outline: 2px solid var(--accent); }
        .calendar .dow { font-size: 9px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .calendar .dom { font-size: 15px; font-weight: 700; }
        .calendar .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.2s;
        }
        .calendar .dot.gold { background: #ffd700; box-shadow: 0 0 6px rgba(255,215,0,0.5); }
        .calendar .dot.orange { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
        .calendar .dot.green { background: var(--done); box-shadow: 0 0 6px var(--done-glow); }
        .calendar .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 4px;
            color: var(--text-secondary);
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .calendar .nav-btn:active { color: var(--text); }

        .time-block { position: relative; overflow: hidden; }
        .time-block.morning { border-left: 3px solid #ffa502; }
        .time-block.day { border-left: 3px solid #54a0ff; }
        .time-block.evening { border-left: 3px solid #a55eea; }
        .time-block .block-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .habit-card {
            background: rgba(255,255,255,0.05);
            border-radius: var(--radius-sm);
            padding: 13px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .habit-card:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .habit-card.done {
            background: rgba(46,213,115,0.12);
            border-color: rgba(46,213,115,0.3);
            box-shadow: 0 0 16px rgba(46,213,115,0.1);
        }
        .habit-check {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            transition: all 0.3s ease;
            background: transparent;
        }
        .habit-card.done .habit-check {
            background: var(--done);
            border-color: var(--done);
            box-shadow: 0 0 12px var(--done-glow);
        }
        .habit-info { flex: 1; }
        .habit-info .name { font-weight: 600; font-size: 16px; color: var(--text); }
        .habit-card.done .habit-info .name { color: #2ed573; }

        .sub-title { font-weight: 600; font-size: 13px; color: var(--text-secondary); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 9px 15px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            color: var(--text);
        }
        .chip:active { transform: scale(0.95); }
        .chip.done {
            background: rgba(46,213,115,0.2);
            border-color: rgba(46,213,115,0.4);
            color: #2ed573;
            box-shadow: 0 0 12px rgba(46,213,115,0.2);
        }

        .water-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .water-cup {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(84,160,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: transparent;
        }
        .water-cup.filled {
            background: rgba(84,160,255,0.3);
            border-color: var(--blue);
            box-shadow: 0 0 14px var(--blue-glow);
        }
        .water-total { font-weight: 600; font-size: 14px; color: var(--blue); text-align: right; margin-top: 10px; }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 8px 6px;
        }

        .metric-row { display: flex; align-items: center; gap: 10px; }
        .metric-label {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 95px;
        }
        .metric-row input {
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: rgba(55,60,70,0.7);
            color: var(--text);
            width: 35%;
            transition: all 0.2s ease;
        }
        .metric-row input:focus {
            border-color: rgba(255,255,255,0.15);
            background: rgba(65,70,80,0.85);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .metric-row input::placeholder { color: rgba(255,255,255,0.2); }
        .diff { font-size: 12px; font-weight: 600; min-width: 105px; text-align: right; }

        .feel-row, .sleep-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .feel-chip, .sleep-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }
        .feel-chip:active, .sleep-chip:active { transform: scale(0.95); }
        .feel-chip.selected, .sleep-chip.selected {
            background: rgba(255,159,67,0.2);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .photo-reminder {
            background: rgba(255,159,67,0.1);
            border: 1px solid rgba(255,159,67,0.3);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .photo-reminder .reminder-text { font-weight: 600; font-size: 14px; color: var(--accent); }
        .photo-reminder .btn-small {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 9px 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .photo-reminder .btn-small:active { transform: scale(0.95); }

        .weight-chart .chart-values {
            font-weight: 600;
            color: var(--text);
            word-break: break-all;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 4px;
        }

        .notes-card textarea {
            width: 100%; border: none; resize: vertical;
            font-size: 16px; font-family: inherit;
            color: var(--text); background: transparent;
            outline: none; min-height: 80px; line-height: 1.5;
        }
        .notes-card textarea::placeholder { color: rgba(255,255,255,0.25); }

        .btn-row { display: flex; gap: 10px; margin: 16px 0; }
        .btn {
            flex: 1; padding: 16px;
            border-radius: 16px;
            font-weight: 600; font-size: 16px;
            text-align: center; cursor: pointer;
            border: none; transition: all 0.2s ease;
            letter-spacing: -0.2px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #000; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
        .btn-ghost {
            background: transparent; color: var(--text-secondary);
            font-weight: 500; font-size: 14px;
            padding: 8px; text-decoration: underline;
            border: none; display: block; margin: 0 auto; cursor: pointer;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,50,0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 99;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .toast.show { opacity: 1; }
        .footer { text-align: center; color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 10px; }
        .reset-area { text-align: center; margin: 20px 0 0; }
    </style>
</head>
<body id="mainBody">
<div class="container" id="app">
    <div class="header">
        <div class="icon" id="headerIcon">🕊️</div>
        <h1>Трекер Яны</h1>
        <div class="time-theme" id="timeThemeLabel">🌙 Вечер</div>
    </div>

    <div class="glass freedom-row">
        <span class="label">Свобода</span>
        <span class="days-count" id="freedomDays">0</span>
    </div>

    <div class="glass streak-row">
        <span class="label">Серия привычек</span>
        <span class="days" id="streakCount">0</span>
    </div>

    <div class="glass calendar" id="calendar"></div>

    <div class="photo-reminder" id="photoReminder" style="display: none;">
        <span class="reminder-text">📸 Сегодня день фото!</span>
        <button class="btn-small" id="photoDoneBtn">Готово</button>
    </div>

    <div class="glass time-block morning">
        <div class="block-title">🌅 Утро</div>
        <div id="morningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="morningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="morningWater"></div>
    </div>

    <div class="glass time-block day">
        <div class="block-title">☀️ День</div>
        <div id="dayHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="daySupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="dayWater"></div>
    </div>

    <div class="glass time-block evening">
        <div class="block-title">🌙 Вечер</div>
        <div id="eveningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="eveningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="eveningWater"></div>
        <div class="water-total" id="waterTotal"></div>
    </div>

    <div class="section-title">💤 Качество сна</div>
    <div class="glass"><div class="sleep-row" id="sleepRow"></div></div>

    <div class="section-title">😌 Оценка самочувствия</div>
    <div class="glass"><div class="feel-row" id="feelRow"></div></div>

    <div class="section-title">⚖️ Вес и замеры</div>
    <div class="glass">
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="metric-row"><span class="metric-label">⚖️ Вес</span><input type="number" id="weightInput" placeholder="кг" step="0.1"><span class="diff" id="weightDiff"></span></div>
            <div class="metric-row"><span class="metric-label">📏 Под грудью</span><input type="number" id="underbustInput" placeholder="см" step="0.1"><span class="diff" id="underbustDiff"></span></div>
            <div class="metric-row"><span class="metric-label">📏 Талия</span><input type="number" id="waistInput" placeholder="см" step="0.1"><span class="diff" id="waistDiff"></span></div>
            <div class="metric-row"><span class="metric-label">📏 Живот</span><input type="number" id="bellyInput" placeholder="см" step="0.1"><span class="diff" id="bellyDiff"></span></div>
            <div class="metric-row"><span class="metric-label">📏 Бёдра</span><input type="number" id="hipsInput" placeholder="см" step="0.1"><span class="diff" id="hipsDiff"></span></div>
            <div class="metric-row"><span class="metric-label">📏 Бедро</span><input type="number" id="thighInput" placeholder="см" step="0.1"><span class="diff" id="thighDiff"></span></div>
        </div>
    </div>

    <div class="glass weight-chart">
        📊 Вес за 7 дней<br><span class="chart-values" id="chartValues">—</span>
    </div>

    <div class="section-title">📝 Заметки</div>
    <div class="glass notes-card"><textarea id="notesField" placeholder="Как прошёл день?"></textarea></div>

    <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Сохранить</button>
        <button class="btn btn-secondary" id="exportBtn">📤 Отчёт</button>
    </div>

    <div class="reset-area"><button class="btn-ghost" id="resetAllBtn">Сбросить все данные</button></div>
    <div class="footer">Трекер Яны</div>
    <div class="toast" id="toast"></div>
</div>

<script>
(function() {
    const STORAGE_KEY = 'yana_tracker_v13';
    const START_DATE = new Date(2026, 6, 19);
    const PHOTO_INTERVAL = 30;

    const MORNING_HABITS = [
        { id: 'wake', name: 'Подъём в 7:30', icon: '⏰' },
        { id: 'shower', name: 'Холодный душ', icon: '🚿' },
        { id: 'protein', name: 'Белковый завтрак', icon: '🍳' },
        { id: 'silence', name: '15 минут тишины', icon: '🧘' }
    ];
    const DAY_HABITS = [{ id: 'workout', name: 'Тренировка', icon: '🏋️' }];
    const EVENING_HABITS = [
        { id: 'steps', name: '10 000 шагов', icon: '👣' },
        { id: 'read', name: '20 страниц книги', icon: '📖' },
        { id: 'mood', name: 'Без жалоб и споров', icon: '😌' }
    ];
    const ALL_HABITS = [...MORNING_HABITS, ...DAY_HABITS, ...EVENING_HABITS];
    const MORNING_SUPPS = ['Цинк+Селен', 'D3+K2', 'Таурин'];
    const DAY_SUPPS = ['Теанин'];
    const EVENING_SUPPS = ['Магний'];
    const WATER_SPLIT = { morning: 2, day: 4, evening: 2 };
    const FEEL_OPTIONS = ['😊 Легко', '😐 Норма', '😞 Устала', '💪 Энергия', '😤 Раздражение', '🤰 Отёки', '😌 Спокойствие', '😬 Тревога', '🥱 Сонливость', '🤕 Головная боль', '❤️ Хорошее настроение'];
    const SLEEP_OPTIONS = ['😴 Плохо', '😐 Средне', '😊 Отлично'];

    function getToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"days":{},"lastPhotoDate":null}');
    if (!data.lastPhotoDate) data.lastPhotoDate = null;
    let today = getToday();
    let selectedDate = today;
    let weekOffset = 0;

    function getDayData(dateKey) {
        if (!data.days[dateKey]) {
            data.days[dateKey] = {
                habits: {},
                supps: {},
                water: {},
                weight: '',
                underbust: '',
                waist: '',
                belly: '',
                hips: '',
                thigh: '',
                feel: [],
                sleep: '',
                photoDone: false,
                notes: ''
            };
        }
        if (!data.days[dateKey].feel) data.days[dateKey].feel = [];
        return data.days[dateKey];
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function toggleHabit(id) { const d = getDayData(selectedDate); d.habits[id] = !d.habits[id]; save(); render(); }
    function toggleSupp(key) { const d = getDayData(selectedDate); d.supps[key] = !d.supps[key]; save(); render(); }
    function toggleWater(key) { const d = getDayData(selectedDate); d.water[key] = !d.water[key]; save(); render(); }
    function toggleFeel(f) {
        const d = getDayData(selectedDate);
        if (d.feel.includes(f)) {
            d.feel = d.feel.filter(x => x !== f);
        } else {
            d.feel.push(f);
        }
        save(); render();
    }
    function setSleep(s) { const d = getDayData(selectedDate); d.sleep = s; save(); render(); }

    function isPhotoDay() {
        if (!data.lastPhotoDate) return true;
        const last = new Date(data.lastPhotoDate);
        return Math.floor((new Date() - last) / 86400000) >= PHOTO_INTERVAL;
    }

    function markPhotoDone() {
        const d = getDayData(selectedDate);
        d.photoDone = true;
        data.lastPhotoDate = selectedDate;
        save(); render();
        showToast('📸 Фото отмечено!');
    }

    function getWeekDays(offset) {
        const now = new Date();
        const dayOfWeek = now.getDay();
        const monday = new Date(now);
        monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1) + (offset * 7));
        const days = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            days.push({ date: d, key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` });
        }
        return days;
    }

    function getDotClass(dateKey) {
        const day = data.days[dateKey];
        if (!day) return '';
        const total = ALL_HABITS.length;
        const done = Object.values(day.habits || {}).filter(v => v).length;
        if (done === total && total > 0) return 'gold';
        if (done >= total / 2 && done > 0) return 'orange';
        if (done >= 1) return 'green';
        return '';
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar');
        const weekDays = getWeekDays(weekOffset);
        const dowNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        let html = '<button class="nav-btn" id="prevWeek">◀</button>';
        weekDays.forEach((wd, i) => {
            const isToday = wd.key === today;
            const isSelected = wd.key === selectedDate;
            html += `<div class="day-cell${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-date="${wd.key}"><span class="dow">${dowNames[i]}</span><span class="dom">${wd.date.getDate()}</span><span class="dot${getDotClass(wd.key) ? ' ' + getDotClass(wd.key) : ''}"></span></div>`;
        });
        html += '<button class="nav-btn" id="nextWeek">▶</button>';
        cal.innerHTML = html;
        cal.querySelectorAll('.day-cell').forEach(cell => cell.onclick = () => { selectedDate = cell.dataset.date; render(); });
        document.getElementById('prevWeek').onclick = () => { weekOffset--; renderCalendar(); render(); };
        document.getElementById('nextWeek').onclick = () => { weekOffset++; renderCalendar(); render(); };
    }

    function getPreviousValue(field) {
        const dates = Object.keys(data.days).sort();
        const vals = [];
        for (const date of dates) {
            if (date >= selectedDate) continue;
            const day = data.days[date];
            if (day && day[field] && !isNaN(parseFloat(day[field]))) vals.push(parseFloat(day[field]));
        }
        if (vals.length === 0) return { first: null, prev: null };
        return { first: vals[0], prev: vals[vals.length - 1] };
    }

    function showDiff(field, diffId) {
        const inputEl = document.getElementById(field + 'Input');
        const diffEl = document.getElementById(diffId);
        if (!inputEl || !diffEl) return;
        const currentVal = parseFloat(inputEl.value);
        if (currentVal && !isNaN(currentVal)) {
            const { first, prev } = getPreviousValue(field);
            if (prev !== null && first !== null) {
                const diffPrev = currentVal - prev;
                const diffFirst = currentVal - first;
                let prevText, prevColor;
                if (diffPrev < 0) { prevText = `▼ ${Math.abs(diffPrev).toFixed(1)}`; prevColor = '#2ed573'; }
                else if (diffPrev > 0) { prevText = `▲ +${diffPrev.toFixed(1)}`; prevColor = '#ff4757'; }
                else { prevText = '0'; prevColor = 'rgba(255,255,255,0.5)'; }
                let firstText, firstColor;
                if (diffFirst < 0) { firstText = `▼ ${Math.abs(diffFirst).toFixed(1)}`; firstColor = '#2ed573'; }
                else if (diffFirst > 0) { firstText = `▲ +${diffFirst.toFixed(1)}`; firstColor = '#ff4757'; }
                else { firstText = '0'; firstColor = 'rgba(255,255,255,0.5)'; }
                diffEl.innerHTML = `<span style="color: ${prevColor};">${prevText}</span> <span style="color: rgba(255,255,255,0.5);">(</span> <span style="color: ${firstColor};">${firstText}</span><span style="color: rgba(255,255,255,0.5);">)</span>`;
            } else {
                diffEl.textContent = '';
            }
        } else {
            diffEl.textContent = '';
        }
    }

    function render() {
        updateTheme();
        document.getElementById('freedomDays').textContent = Math.floor((new Date() - START_DATE) / 86400000);

        let streak = 0;
        const d = new Date();
        for (let i = 0; i < 365; i++) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            if (day && day.habits && Object.values(day.habits).filter(v => v).length >= 1) { streak++; continue; }
            break;
        }
        document.getElementById('streakCount').textContent = streak;

        renderCalendar();
        const current = getDayData(selectedDate);

        const pr = document.getElementById('photoReminder');
        pr.style.display = (selectedDate === today && isPhotoDay() && !current.photoDone) ? 'flex' : 'none';

        function renderHabits(containerId, habits) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            habits.forEach(h => {
                const done = current.habits && current.habits[h.id] === true;
                const card = document.createElement('div');
                card.className = 'habit-card' + (done ? ' done' : '');
                card.innerHTML = `<div class="habit-check">${done ? '✓' : h.icon}</div><div class="habit-info"><div class="name">${h.name}</div></div>`;
                card.onclick = () => { toggleHabit(h.id); };
                c.appendChild(card);
            });
        }
        renderHabits('morningHabits', MORNING_HABITS);
        renderHabits('dayHabits', DAY_HABITS);
        renderHabits('eveningHabits', EVENING_HABITS);

        function renderSupps(containerId, list, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            list.forEach(s => {
                const key = prefix + s;
                const done = current.supps && current.supps[key] === true;
                const chip = document.createElement('span');
                chip.className = 'chip' + (done ? ' done' : '');
                chip.textContent = (done ? '✅ ' : '💊 ') + s;
                chip.onclick = () => { toggleSupp(key); };
                c.appendChild(chip);
            });
        }
        renderSupps('morningSupps', MORNING_SUPPS, 'm_');
        renderSupps('daySupps', DAY_SUPPS, 'd_');
        renderSupps('eveningSupps', EVENING_SUPPS, 'e_');

        function renderWater(containerId, count, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const key = prefix + i;
                const filled = current.water && current.water[key] === true;
                const cup = document.createElement('span');
                cup.className = 'water-cup' + (filled ? ' filled' : '');
                cup.textContent = filled ? '💧' : '';
                cup.onclick = () => { toggleWater(key); };
                c.appendChild(cup);
            }
        }
        renderWater('morningWater', WATER_SPLIT.morning, 'wm_');
        renderWater('dayWater', WATER_SPLIT.day, 'wd_');
        renderWater('eveningWater', WATER_SPLIT.evening, 'we_');

        let tw = 0, tc = 0;
        Object.keys(WATER_SPLIT).forEach(p => {
            const px = p === 'morning' ? 'wm_' : p === 'day' ? 'wd_' : 'we_';
            for (let i = 1; i <= WATER_SPLIT[p]; i++) { tc++; if (current.water && current.water[px + i]) tw++; }
        });
        document.getElementById('waterTotal').textContent = `💧 Всего: ${tw} из ${tc} стаканов`;

        const sleepRow = document.getElementById('sleepRow');
        sleepRow.innerHTML = '';
        SLEEP_OPTIONS.forEach(s => {
            const chip = document.createElement('span');
            chip.className = 'sleep-chip' + (current.sleep === s ? ' selected' : '');
            chip.textContent = s;
            chip.onclick = () => { setSleep(s); };
            sleepRow.appendChild(chip);
        });

        const feelRow = document.getElementById('feelRow');
        feelRow.innerHTML = '';
        FEEL_OPTIONS.forEach(f => {
            const selected = current.feel && current.feel.includes(f);
            const chip = document.createElement('span');
            chip.className = 'feel-chip' + (selected ? ' selected' : '');
            chip.textContent = f;
            chip.onclick = () => { toggleFeel(f); };
            feelRow.appendChild(chip);
        });

        document.getElementById('weightInput').value = current.weight || '';
        document.getElementById('underbustInput').value = current.underbust || '';
        document.getElementById('waistInput').value = current.waist || '';
        document.getElementById('bellyInput').value = current.belly || '';
        document.getElementById('hipsInput').value = current.hips || '';
        document.getElementById('thighInput').value = current.thigh || '';

        showDiff('weight', 'weightDiff');
        showDiff('underbust', 'underbustDiff');
        showDiff('waist', 'waistDiff');
        showDiff('belly', 'bellyDiff');
        showDiff('hips', 'hipsDiff');
        showDiff('thigh', 'thighDiff');

        const cv = [];
        const now = new Date();
        for (let i = 6; i >= 0; i--) {
            const c = new Date(now); c.setDate(now.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            cv.push((day && day.weight) ? day.weight : '—');
        }
        document.getElementById('chartValues').textContent = cv.join(' → ');
        document.getElementById('notesField').value = current.notes || '';
    }

    function updateTheme() {
        const hour = new Date().getHours();
        const body = document.getElementById('mainBody');
        const icon = document.getElementById('headerIcon');
        const label = document.getElementById('timeThemeLabel');
        body.classList.remove('morning', 'day', 'evening');
        if (hour >= 5 && hour < 11) {
            body.classList.add('morning');
            icon.textContent = '🌅';
            label.textContent = '🌅 Рассвет';
        } else if (hour >= 11 && hour < 17) {
            body.classList.add('day');
            icon.textContent = '☀️';
            label.textContent = '☀️ День';
        } else {
            body.classList.add('evening');
            icon.textContent = '🌙';
            label.textContent = '🌙 Вечер';
        }
    }

    function saveAll() {
        const d = getDayData(selectedDate);
        d.weight = document.getElementById('weightInput').value.trim();
        d.underbust = document.getElementById('underbustInput').value.trim();
        d.waist = document.getElementById('waistInput').value.trim();
        d.belly = document.getElementById('bellyInput').value.trim();
        d.hips = document.getElementById('hipsInput').value.trim();
        d.thigh = document.getElementById('thighInput').value.trim();
        d.notes = document.getElementById('notesField').value.trim();
        save(); render();
        showToast('💾 Сохранено!');
    }

    function exportReport() {
        saveAll();
        const lines = [];
        const d = new Date();
        for (let i = 6; i >= 0; i--) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            if (!day) continue;
            const hasHabits = day.habits && Object.keys(day.habits).length > 0;
            const hasOther = day.weight || day.underbust || day.waist || day.belly || day.hips || day.thigh || (day.feel && day.feel.length > 0) || day.sleep || day.photoDone || day.notes;
            if (!hasHabits && !hasOther) continue;
            const ds = c.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            if (hasHabits) {
                const total = ALL_HABITS.length;
                const done = Object.values(day.habits).filter(v => v).length;
                lines.push(`📅 ${ds} — ${done}/${total} привычек`);
                ALL_HABITS.forEach(h => lines.push(`   ${day.habits[h.id] ? '✅' : '❌'} ${h.name}`));
            } else {
                lines.push(`📅 ${ds} — нет привычек, но есть данные`);
            }
            if (day.sleep) lines.push(`   💤 Сон: ${day.sleep}`);
            if (day.feel && day.feel.length > 0) lines.push(`   😌 Самочувствие: ${day.feel.join(', ')}`);
            if (day.weight) lines.push(`   ⚖️ Вес: ${day.weight} кг`);
            if (day.underbust) lines.push(`   📏 Под грудью: ${day.underbust} см`);
            if (day.waist) lines.push(`   📏 Талия: ${day.waist} см`);
            if (day.belly) lines.push(`   📏 Живот: ${day.belly} см`);
            if (day.hips) lines.push(`   📏 Бёдра: ${day.hips} см`);
            if (day.thigh) lines.push(`   📏 Бедро: ${day.thigh} см`);
            if (day.photoDone) lines.push(`   📸 Фото сделано`);
            if (day.notes) lines.push(`   📝 ${day.notes}`);
        }
        const txt = `🕊️ Отчёт Яны\nСвобода: ${document.getElementById('freedomDays').textContent} дней | 🔥 Серия: ${document.getElementById('streakCount').textContent}\n${'─'.repeat(20)}\n${lines.join('\n')}\n${'─'.repeat(20)}\n✨ Ты справляешься.`;
        navigator.clipboard.writeText(txt).then(() => showToast('📋 Отчёт скопирован!'));
    }

    function resetAll() {
        if (confirm('Удалить все данные?')) {
            localStorage.removeItem(STORAGE_KEY);
            data = { days: {}, lastPhotoDate: null };
            selectedDate = today;
            weekOffset = 0;
            render();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('saveBtn').onclick = saveAll;
    document.getElementById('exportBtn').onclick = exportReport;
    document.getElementById('resetAllBtn').onclick = resetAll;
    document.getElementById('photoDoneBtn').onclick = markPhotoDone;

    render();
})();
</script>
</body>
</html>
