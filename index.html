<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Трекер Яны</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #8e8e93;
            --accent: #ff9500;
            --border: #e5e5ea;
            --done: #34c759;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 100px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .container { max-width: 480px; margin: 0 auto; }

        .header { text-align: center; padding: 20px 0 12px; }
        .header .icon { font-size: 42px; margin-bottom: 6px; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }

        .freedom-card {
            background: #e8f5e9;
            border-radius: var(--radius);
            padding: 16px 20px;
            margin: 8px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid #a5d6a7;
        }
        .freedom-card .days-count { font-size: 40px; font-weight: 800; color: #2e7d32; letter-spacing: -1px; line-height: 1; }
        .freedom-card .label { font-size: 14px; color: #388e3c; font-weight: 600; }

        .streak-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin: 12px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .streak-card .days { font-size: 40px; font-weight: 800; color: var(--accent); letter-spacing: -1px; line-height: 1; }
        .streak-card .label { font-size: 13px; color: var(--sub); font-weight: 500; }

        .time-block {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }
        .time-block.morning { background: #fffdf5; border-color: #ffe082; }
        .time-block.day { background: #f5faff; border-color: #90caf9; }
        .time-block.evening { background: #fdf5ff; border-color: #ce93d8; }

        .block-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .habit-card {
            background: rgba(255,255,255,0.8);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .habit-card:active { transform: scale(0.985); }
        .habit-card.done { border-color: transparent; background: #f0faf2; }
        .habit-card.done .habit-check { background: var(--done); border-color: var(--done); }
        .habit-check {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid #d1d1d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.25s;
            background: #fff;
        }
        .habit-info { flex: 1; }
        .habit-info .name { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
        .habit-card.done .habit-info .name { color: #1b5e20; }

        .sub-title { font-weight: 600; font-size: 14px; margin: 10px 0 6px; }

        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .chip:active { transform: scale(0.95); }
        .chip.done { background: var(--done); border-color: var(--done); color: #fff; }

        .water-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .water-cup {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid #64b5f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }
        .water-cup.filled { background: #64b5f6; }
        .water-total { font-weight: 600; font-size: 15px; color: #1976d2; text-align: right; margin-top: 10px; }

        .metrics-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .metrics-card .metric-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .metrics-card input {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #f9f9f9;
            width: 100%;
        }
        .metrics-card input:focus { border-color: var(--accent); }
        .feel-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .feel-chip {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .feel-chip:active { transform: scale(0.95); }
        .feel-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

        .notes-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .notes-card textarea {
            width: 100%; border: none; resize: vertical;
            font-size: 15px; font-family: inherit;
            color: var(--text); background: transparent;
            outline: none; min-height: 70px; line-height: 1.5;
        }
        .notes-card textarea::placeholder { color: #c7c7cc; }

        .btn-row { display: flex; gap: 10px; margin: 16px 0; }
        .btn {
            flex: 1; padding: 14px;
            border-radius: 12px;
            font-weight: 600; font-size: 15px;
            text-align: center; cursor: pointer;
            border: none; transition: all 0.2s;
            letter-spacing: -0.2px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
        .btn-ghost {
            background: transparent; color: var(--sub);
            font-weight: 500; font-size: 13px;
            padding: 8px; text-decoration: underline;
            border: none; display: block; margin: 0 auto; cursor: pointer;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a; color: #fff;
            padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 99;
        }
        .toast.show { opacity: 1; }
        .footer { text-align: center; color: #c7c7cc; font-size: 11px; margin-top: 10px; }
        .reset-area { text-align: center; margin: 20px 0 0; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <div class="icon">🕊️</div>
        <h1>Трекер Яны</h1>
    </div>
    <div class="freedom-card">
        <div class="label">Свобода</div>
        <div class="days-count" id="freedomDays">0</div>
    </div>
    <div class="streak-card">
        <div class="label">Серия привычек</div>
        <div class="days" id="streakCount">0</div>
    </div>

    <!-- УТРО -->
    <div class="time-block morning">
        <div class="block-title">🌅 УТРО</div>
        <div id="morningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="morningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="morningWater"></div>
    </div>

    <!-- ДЕНЬ -->
    <div class="time-block day">
        <div class="block-title">☀️ ДЕНЬ</div>
        <div id="dayHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="daySupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="dayWater"></div>
    </div>

    <!-- ВЕЧЕР -->
    <div class="time-block evening">
        <div class="block-title">🌙 ВЕЧЕР</div>
        <div id="eveningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="eveningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="eveningWater"></div>
        <div class="water-total" id="waterTotal"></div>
    </div>

    <!-- ВЕС И ЗАМЕРЫ -->
    <div class="section-title">⚖️ ВЕС И ЗАМЕРЫ</div>
    <div class="metrics-card">
        <div class="metric-col">
            <input type="number" id="weightInput" placeholder="Вес, кг" step="0.1">
            <input type="number" id="waistInput" placeholder="Талия, см" step="0.1">
            <input type="number" id="hipsInput" placeholder="Бёдра, см" step="0.1">
        </div>
        <div class="feel-row" id="feelRow"></div>
    </div>

    <!-- ЗАМЕТКИ -->
    <div class="section-title">📝 ЗАМЕТКИ</div>
    <div class="notes-card">
        <textarea id="notesField" placeholder="Как прошёл день?"></textarea>
    </div>

    <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Сохранить</button>
        <button class="btn btn-secondary" id="exportBtn">📤 Отчёт</button>
    </div>

    <div class="reset-area">
        <button class="btn-ghost" id="resetAllBtn">Сбросить все данные</button>
    </div>
    <div class="footer">Трекер Яны</div>
    <div class="toast" id="toast"></div>
</div>

<script>
(function() {
    const STORAGE_KEY = 'yana_tracker_v5';
    const START_DATE = new Date(2026, 6, 19); // 19 июля 2026

    const MORNING_HABITS = [
        { id: 'wake', name: 'Подъём в 7:30', icon: '⏰' },
        { id: 'shower', name: 'Холодный душ', icon: '🚿' },
        { id: 'protein', name: 'Белковый завтрак', icon: '🍳' },
        { id: 'silence', name: '15 минут тишины', icon: '🧘' }
    ];
    const DAY_HABITS = [
        { id: 'workout', name: 'Тренировка', icon: '🏋️' }
    ];
    const EVENING_HABITS = [
        { id: 'steps', name: '10 000 шагов', icon: '👣' },
        { id: 'read', name: '20 страниц книги', icon: '📖' },
        { id: 'mood', name: 'Без жалоб и споров', icon: '😌' }
    ];
    const MORNING_SUPPS = ['Цинк+Селен', 'D3+K2', 'Таурин'];
    const DAY_SUPPS = ['Теанин'];
    const EVENING_SUPPS = ['Магний'];
    const WATER_SPLIT = { morning: 2, day: 4, evening: 2 };
    const FEEL_OPTIONS = ['😊 Легко', '😐 Норма', '😞 Устала', '💪 Энергия', '😤 Раздражение', '🤰 Отёки'];

    function getToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"days":{}}');
    let today = getToday();
    let current = data.days[today] || { habits: {}, supps: {}, water: {}, weight: '', waist: '', hips: '', feel: '', notes: '' };

    function save() { data.days[today] = current; localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function toggleHabit(id) { current.habits[id] = !current.habits[id]; save(); render(); }
    function toggleSupp(key) { current.supps[key] = !current.supps[key]; save(); render(); }
    function toggleWater(key) { current.water[key] = !current.water[key]; save(); render(); }
    function setFeel(f) { current.feel = f; save(); render(); }

    function render() {
        const freedomDays = Math.floor((new Date() - START_DATE) / 86400000);
        document.getElementById('freedomDays').textContent = freedomDays;

        let streak = 0;
        const d = new Date();
        for (let i = 0; i < 365; i++) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            if (day && day.habits && Object.values(day.habits).filter(v=>v).length >= 1) { streak++; continue; }
            if (i === 0 && current.habits && Object.values(current.habits).filter(v=>v).length >= 1) { streak++; continue; }
            break;
        }
        document.getElementById('streakCount').textContent = streak;

        function renderHabits(containerId, habits) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            habits.forEach(h => {
                const done = current.habits[h.id] === true;
                const card = document.createElement('div');
                card.className = 'habit-card' + (done ? ' done' : '');
                card.innerHTML = `<div class="habit-check">${done ? '✅' : h.icon}</div><div class="habit-info"><div class="name">${h.name}</div></div>`;
                card.onclick = () => toggleHabit(h.id);
                c.appendChild(card);
            });
        }
        renderHabits('morningHabits', MORNING_HABITS);
        renderHabits('dayHabits', DAY_HABITS);
        renderHabits('eveningHabits', EVENING_HABITS);

        function renderSupps(containerId, list, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            list.forEach(s => {
                const key = prefix + s;
                const done = current.supps[key] === true;
                const chip = document.createElement('span');
                chip.className = 'chip' + (done ? ' done' : '');
                chip.textContent = (done ? '✅ ' : '') + s;
                chip.onclick = () => toggleSupp(key);
                c.appendChild(chip);
            });
        }
        renderSupps('morningSupps', MORNING_SUPPS, 'm_');
        renderSupps('daySupps', DAY_SUPPS, 'd_');
        renderSupps('eveningSupps', EVENING_SUPPS, 'e_');

        function renderWater(containerId, count, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const key = prefix + i;
                const filled = current.water[key] === true;
                const cup = document.createElement('span');
                cup.className = 'water-cup' + (filled ? ' filled' : '');
                cup.textContent = filled ? '💧' : '';
                cup.onclick = () => toggleWater(key);
                c.appendChild(cup);
            }
        }
        renderWater('morningWater', WATER_SPLIT.morning, 'wm_');
        renderWater('dayWater', WATER_SPLIT.day, 'wd_');
        renderWater('eveningWater', WATER_SPLIT.evening, 'we_');

        let totalWater = 0, totalCups = 0;
        Object.keys(WATER_SPLIT).forEach(part => {
            const count = WATER_SPLIT[part];
            const prefix = part === 'morning' ? 'wm_' : part === 'day' ? 'wd_' : 'we_';
            for (let i = 1; i <= count; i++) { totalCups++; if (current.water[prefix + i]) totalWater++; }
        });
        document.getElementById('waterTotal').textContent = `💧 Всего воды: ${totalWater} из ${totalCups} стаканов`;

        document.getElementById('weightInput').value = current.weight || '';
        document.getElementById('waistInput').value = current.waist || '';
        document.getElementById('hipsInput').value = current.hips || '';

        const feelRow = document.getElementById('feelRow');
        feelRow.innerHTML = '';
        FEEL_OPTIONS.forEach(f => {
            const chip = document.createElement('span');
            chip.className = 'feel-chip' + (current.feel === f ? ' selected' : '');
            chip.textContent = f;
            chip.onclick = () => setFeel(f);
            feelRow.appendChild(chip);
        });

        document.getElementById('notesField').value = current.notes || '';
    }

    function saveAll() {
        current.weight = document.getElementById('weightInput').value.trim();
        current.waist = document.getElementById('waistInput').value.trim();
        current.hips = document.getElementById('hipsInput').value.trim();
        current.notes = document.getElementById('notesField').value.trim();
        save();
        render();
        showToast('💾 Сохранено!');
    }

    function exportReport() {
        saveAll();
        const lines = [];
        const d = new Date();
        for (let i = 6; i >= 0; i--) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            const ds = c.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            if (day && day.habits && Object.keys(day.habits).length > 0) {
                const total = MORNING_HABITS.length + DAY_HABITS.length + EVENING_HABITS.length;
                const done = Object.values(day.habits).filter(v=>v).length;
                lines.push(`📅 ${ds} — ${done}/${total} привычек`);
                if (day.weight) lines.push(`   ⚖️ Вес: ${day.weight} кг`);
                if (day.feel) lines.push(`   😌 Самочувствие: ${day.feel}`);
                if (day.notes) lines.push(`   📝 ${day.notes}`);
            } else {
                lines.push(`📅 ${ds} — нет данных`);
            }
        }
        const txt = `🕊️ Отчёт Яны\nСвобода: ${document.getElementById('freedomDays').textContent} дней | 🔥 Серия: ${document.getElementById('streakCount').textContent}\n${'─'.repeat(20)}\n${lines.join('\n')}\n${'─'.repeat(20)}\n✨ Ты справляешься.`;
        navigator.clipboard.writeText(txt).then(() => showToast('📋 Отчёт скопирован!'));
    }

    function resetAll() {
        if (confirm('Удалить все данные?')) {
            localStorage.removeItem(STORAGE_KEY);
            data = { days: {} };
            current = { habits: {}, supps: {}, water: {}, weight: '', waist: '', hips: '', feel: '', notes: '' };
            render();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('saveBtn').onclick = saveAll;
    document.getElementById('exportBtn').onclick = exportReport;
    document.getElementById('resetAllBtn').onclick = resetAll;

    if (!data.days[today]) current = { habits: {}, supps: {}, water: {}, weight: '', waist: '', hips: '', feel: '', notes: '' };
    render();
})();
</script>
</body>
</html>
