<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Трекер Яны</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #8e8e93;
            --accent: #ff9500;
            --border: #e5e5ea;
            --done: #34c759;
            --gold: #ffcc00;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px 100px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0 12px; }
        .header .icon { font-size: 42px; margin-bottom: 6px; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }

        .freedom-card {
            background: #e8f5e9;
            border-radius: var(--radius);
            padding: 16px 20px;
            margin: 8px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid #a5d6a7;
        }
        .freedom-card .days-count { font-size: 40px; font-weight: 800; color: #2e7d32; letter-spacing: -1px; line-height: 1; }
        .freedom-card .label { font-size: 14px; color: #388e3c; font-weight: 600; }

        .streak-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px 20px;
            margin: 12px 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .streak-card .days { font-size: 40px; font-weight: 800; color: var(--accent); letter-spacing: -1px; line-height: 1; }
        .streak-card .label { font-size: 13px; color: var(--sub); font-weight: 500; }

        /* Календарь */
        .calendar {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .calendar .day-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 14px;
            transition: all 0.2s;
            min-width: 38px;
        }
        .calendar .day-cell:active { transform: scale(0.92); }
        .calendar .day-cell.today { border: 2px solid var(--accent); }
        .calendar .day-cell.selected { background: #fff3e0; }
        .calendar .day-cell .dow { font-size: 11px; color: var(--sub); font-weight: 500; text-transform: uppercase; }
        .calendar .day-cell .dom { font-size: 17px; font-weight: 700; }
        .calendar .day-cell .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #d1d1d6;
        }
        .calendar .day-cell .dot.gold { background: var(--gold); }
        .calendar .day-cell .dot.orange { background: var(--accent); }
        .calendar .day-cell .dot.green { background: var(--done); }
        .calendar .nav-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            color: var(--accent);
        }

        .time-block {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid transparent;
        }
        .time-block.morning { background: #fffdf5; border-color: #ffe082; }
        .time-block.day { background: #f5faff; border-color: #90caf9; }
        .time-block.evening { background: #fdf5ff; border-color: #ce93d8; }

        .block-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

        .habit-card {
            background: rgba(255,255,255,0.8);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .habit-card:active { transform: scale(0.985); }
        .habit-card.done { border-color: transparent; background: #f0faf2; }
        .habit-card.done .habit-check { background: var(--done); border-color: var(--done); }
        .habit-check {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid #d1d1d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.25s;
            background: #fff;
        }
        .habit-info { flex: 1; }
        .habit-info .name { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
        .habit-card.done .habit-info .name { color: #1b5e20; }

        .sub-title { font-weight: 600; font-size: 14px; margin: 10px 0 6px; }

        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .chip:active { transform: scale(0.95); }
        .chip.done { background: var(--done); border-color: var(--done); color: #fff; }

        .water-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .water-cup {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid #64b5f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
        }
        .water-cup.filled { background: #64b5f6; }
        .water-total { font-weight: 600; font-size: 15px; color: #1976d2; text-align: right; margin-top: 10px; }

        .metrics-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .metrics-card .metric-col { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .metrics-card input {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: #f9f9f9;
            width: 100%;
        }
        .metrics-card input:focus { border-color: var(--accent); }
        .feel-row, .sleep-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .feel-chip, .sleep-chip {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .feel-chip:active, .sleep-chip:active { transform: scale(0.95); }
        .feel-chip.selected, .sleep-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

        .photo-reminder {
            background: #fff3e0;
            border: 1px solid #ffcc80;
            border-radius: 16px;
            padding: 14px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .photo-reminder .reminder-text { font-weight: 600; font-size: 14px; color: #e65100; }
        .photo-reminder .btn-small {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .photo-reminder .btn-small:active { transform: scale(0.95); }

        .weight-chart {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            font-size: 14px;
            color: var(--sub);
            text-align: center;
        }
        .weight-chart .chart-values { font-weight: 600; color: var(--text); word-break: break-all; }

        .notes-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin: 12px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .notes-card textarea {
            width: 100%; border: none; resize: vertical;
            font-size: 15px; font-family: inherit;
            color: var(--text); background: transparent;
            outline: none; min-height: 70px; line-height: 1.5;
        }
        .notes-card textarea::placeholder { color: #c7c7cc; }

        .btn-row { display: flex; gap: 10px; margin: 16px 0; }
        .btn {
            flex: 1; padding: 14px;
            border-radius: 12px;
            font-weight: 600; font-size: 15px;
            text-align: center; cursor: pointer;
            border: none; transition: all 0.2s;
            letter-spacing: -0.2px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
        .btn-ghost {
            background: transparent; color: var(--sub);
            font-weight: 500; font-size: 13px;
            padding: 8px; text-decoration: underline;
            border: none; display: block; margin: 0 auto; cursor: pointer;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a; color: #fff;
            padding: 12px 24px; border-radius: 30px;
            font-weight: 600; font-size: 14px;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 99;
        }
        .toast.show { opacity: 1; }
        .footer { text-align: center; color: #c7c7cc; font-size: 11px; margin-top: 10px; }
        .reset-area { text-align: center; margin: 20px 0 0; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <div class="icon">🕊️</div>
        <h1>Трекер Яны</h1>
    </div>
    <div class="freedom-card">
        <div class="label">Свобода</div>
        <div class="days-count" id="freedomDays">0</div>
    </div>
    <div class="streak-card">
        <div class="label">Серия привычек</div>
        <div class="days" id="streakCount">0</div>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div class="calendar" id="calendar"></div>

    <!-- Фото-напоминалка -->
    <div class="photo-reminder" id="photoReminder" style="display: none;">
        <span class="reminder-text">📸 Сегодня день фото!</span>
        <button class="btn-small" id="photoDoneBtn">Готово</button>
    </div>

    <!-- УТРО -->
    <div class="time-block morning">
        <div class="block-title">🌅 УТРО</div>
        <div id="morningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="morningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="morningWater"></div>
    </div>

    <!-- ДЕНЬ -->
    <div class="time-block day">
        <div class="block-title">☀️ ДЕНЬ</div>
        <div id="dayHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="daySupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="dayWater"></div>
    </div>

    <!-- ВЕЧЕР -->
    <div class="time-block evening">
        <div class="block-title">🌙 ВЕЧЕР</div>
        <div id="eveningHabits"></div>
        <div class="sub-title">💊 Добавки</div>
        <div class="chip-row" id="eveningSupps"></div>
        <div class="sub-title">💧 Вода</div>
        <div class="water-row" id="eveningWater"></div>
        <div class="water-total" id="waterTotal"></div>
    </div>

    <!-- СОН -->
    <div class="section-title">💤 КАЧЕСТВО СНА</div>
    <div class="metrics-card">
        <div class="sleep-row" id="sleepRow"></div>
    </div>

    <!-- САМОЧУВСТВИЕ -->
    <div class="section-title">😌 ОЦЕНКА САМОЧУВСТВИЯ</div>
    <div class="metrics-card">
        <div class="feel-row" id="feelRow"></div>
    </div>

    <!-- ВЕС И ЗАМЕРЫ -->
    <div class="section-title">⚖️ ВЕС И ЗАМЕРЫ</div>
    <div class="metrics-card">
        <div class="metric-col">
            <input type="number" id="weightInput" placeholder="Вес, кг" step="0.1">
            <input type="number" id="underbustInput" placeholder="Под грудью, см" step="0.1">
            <input type="number" id="waistInput" placeholder="Талия, см" step="0.1">
            <input type="number" id="bellyInput" placeholder="Живот, см" step="0.1">
            <input type="number" id="hipsInput" placeholder="Бёдра, см" step="0.1">
            <input type="number" id="thighInput" placeholder="Бедро, см" step="0.1">
        </div>
    </div>

    <!-- МИНИ-ГРАФИК ВЕСА -->
    <div class="weight-chart" id="weightChart">
        📊 Вес за 7 дней: <span class="chart-values" id="chartValues">—</span>
    </div>

    <!-- ЗАМЕТКИ -->
    <div class="section-title">📝 ЗАМЕТКИ</div>
    <div class="notes-card">
        <textarea id="notesField" placeholder="Как прошёл день?"></textarea>
    </div>

    <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn">💾 Сохранить</button>
        <button class="btn btn-secondary" id="exportBtn">📤 Отчёт</button>
    </div>

    <div class="reset-area">
        <button class="btn-ghost" id="resetAllBtn">Сбросить все данные</button>
    </div>
    <div class="footer">Трекер Яны</div>
    <div class="toast" id="toast"></div>
</div>

<script>
(function() {
    const STORAGE_KEY = 'yana_tracker_v8';
    const START_DATE = new Date(2026, 6, 19);
    const PHOTO_INTERVAL = 30;

    const MORNING_HABITS = [
        { id: 'wake', name: 'Подъём в 7:30', icon: '⏰' },
        { id: 'shower', name: 'Холодный душ', icon: '🚿' },
        { id: 'protein', name: 'Белковый завтрак', icon: '🍳' },
        { id: 'silence', name: '15 минут тишины', icon: '🧘' }
    ];
    const DAY_HABITS = [
        { id: 'workout', name: 'Тренировка', icon: '🏋️' }
    ];
    const EVENING_HABITS = [
        { id: 'steps', name: '10 000 шагов', icon: '👣' },
        { id: 'read', name: '20 страниц книги', icon: '📖' },
        { id: 'mood', name: 'Без жалоб и споров', icon: '😌' }
    ];
    const ALL_HABITS = [...MORNING_HABITS, ...DAY_HABITS, ...EVENING_HABITS];

    const MORNING_SUPPS = ['Цинк+Селен', 'D3+K2', 'Таурин'];
    const DAY_SUPPS = ['Теанин'];
    const EVENING_SUPPS = ['Магний'];
    const WATER_SPLIT = { morning: 2, day: 4, evening: 2 };
    const FEEL_OPTIONS = ['😊 Легко', '😐 Норма', '😞 Устала', '💪 Энергия', '😤 Раздражение', '🤰 Отёки'];
    const SLEEP_OPTIONS = ['😴 Плохо', '😐 Средне', '😊 Отлично'];

    function getToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"days":{},"lastPhotoDate":null}');
    if (!data.lastPhotoDate) data.lastPhotoDate = null;
    let today = getToday();
    let selectedDate = today;
    let weekOffset = 0; // 0 = текущая неделя

    function getDayData(dateKey) {
        if (dateKey === today) {
            if (!data.days[today]) data.days[today] = { habits: {}, supps: {}, water: {}, weight: '', underbust: '', waist: '', belly: '', hips: '', thigh: '', feel: '', sleep: '', photoDone: false, notes: '' };
            return data.days[today];
        }
        if (!data.days[dateKey]) return { habits: {}, supps: {}, water: {}, weight: '', underbust: '', waist: '', belly: '', hips: '', thigh: '', feel: '', sleep: '', photoDone: false, notes: '' };
        return data.days[dateKey];
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function toggleHabit(id) { const d = getDayData(selectedDate); d.habits[id] = !d.habits[id]; save(); render(); }
    function toggleSupp(key) { const d = getDayData(selectedDate); d.supps[key] = !d.supps[key]; save(); render(); }
    function toggleWater(key) { const d = getDayData(selectedDate); d.water[key] = !d.water[key]; save(); render(); }
    function setFeel(f) { const d = getDayData(selectedDate); d.feel = f; save(); render(); }
    function setSleep(s) { const d = getDayData(selectedDate); d.sleep = s; save(); render(); }

    function isPhotoDay() {
        if (!data.lastPhotoDate) return true;
        const last = new Date(data.lastPhotoDate);
        const now = new Date();
        return Math.floor((now - last) / 86400000) >= PHOTO_INTERVAL;
    }

    function markPhotoDone() {
        const d = getDayData(selectedDate);
        d.photoDone = true;
        data.lastPhotoDate = selectedDate;
        save();
        render();
        showToast('📸 Фото отмечено!');
    }

    function getWeekDays(offset) {
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0 = вс
        const monday = new Date(now);
        monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1) + (offset * 7));
        const days = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(monday);
            d.setDate(monday.getDate() + i);
            const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            days.push({ date: d, key: key });
        }
        return days;
    }

    function getDotClass(dateKey) {
        const day = data.days[dateKey];
        if (!day || !day.habits) return '';
        const total = ALL_HABITS.length;
        const done = Object.values(day.habits).filter(v => v).length;
        if (done === total) return 'gold';
        if (done >= total / 2) return 'orange';
        if (done >= 1) return 'green';
        return '';
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar');
        const weekDays = getWeekDays(weekOffset);
        const dowNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        let html = '<button class="nav-btn" id="prevWeek">◀</button>';
        weekDays.forEach((wd, i) => {
            const isToday = wd.key === today;
            const isSelected = wd.key === selectedDate;
            const dotClass = getDotClass(wd.key);
            html += `
                <div class="day-cell${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-date="${wd.key}">
                    <span class="dow">${dowNames[i]}</span>
                    <span class="dom">${wd.date.getDate()}</span>
                    <span class="dot${dotClass ? ' ' + dotClass : ''}"></span>
                </div>`;
        });
        html += '<button class="nav-btn" id="nextWeek">▶</button>';
        cal.innerHTML = html;

        cal.querySelectorAll('.day-cell').forEach(cell => {
            cell.onclick = () => {
                selectedDate = cell.dataset.date;
                render();
            };
        });
        document.getElementById('prevWeek').onclick = () => { weekOffset--; renderCalendar(); render(); };
        document.getElementById('nextWeek').onclick = () => { weekOffset++; renderCalendar(); render(); };
    }

    function render() {
        const freedomDays = Math.floor((new Date() - START_DATE) / 86400000);
        document.getElementById('freedomDays').textContent = freedomDays;

        let streak = 0;
        const d = new Date();
        for (let i = 0; i < 365; i++) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            if (day && day.habits && Object.values(day.habits).filter(v=>v).length >= 1) { streak++; continue; }
            break;
        }
        document.getElementById('streakCount').textContent = streak;

        renderCalendar();

        const current = getDayData(selectedDate);

        // Photo
        const photoReminder = document.getElementById('photoReminder');
        if (selectedDate === today && isPhotoDay() && !current.photoDone) {
            photoReminder.style.display = 'flex';
        } else {
            photoReminder.style.display = 'none';
        }

        function renderHabits(containerId, habits) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            habits.forEach(h => {
                const done = current.habits && current.habits[h.id] === true;
                const card = document.createElement('div');
                card.className = 'habit-card' + (done ? ' done' : '');
                card.innerHTML = `<div class="habit-check">${done ? '✅' : h.icon}</div><div class="habit-info"><div class="name">${h.name}</div></div>`;
                card.onclick = () => { toggleHabit(h.id); };
                c.appendChild(card);
            });
        }
        renderHabits('morningHabits', MORNING_HABITS);
        renderHabits('dayHabits', DAY_HABITS);
        renderHabits('eveningHabits', EVENING_HABITS);

        function renderSupps(containerId, list, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            list.forEach(s => {
                const key = prefix + s;
                const done = current.supps && current.supps[key] === true;
                const chip = document.createElement('span');
                chip.className = 'chip' + (done ? ' done' : '');
                chip.textContent = (done ? '✅ ' : '') + s;
                chip.onclick = () => { toggleSupp(key); };
                c.appendChild(chip);
            });
        }
        renderSupps('morningSupps', MORNING_SUPPS, 'm_');
        renderSupps('daySupps', DAY_SUPPS, 'd_');
        renderSupps('eveningSupps', EVENING_SUPPS, 'e_');

        function renderWater(containerId, count, prefix) {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                const key = prefix + i;
                const filled = current.water && current.water[key] === true;
                const cup = document.createElement('span');
                cup.className = 'water-cup' + (filled ? ' filled' : '');
                cup.textContent = filled ? '💧' : '';
                cup.onclick = () => { toggleWater(key); };
                c.appendChild(cup);
            }
        }
        renderWater('morningWater', WATER_SPLIT.morning, 'wm_');
        renderWater('dayWater', WATER_SPLIT.day, 'wd_');
        renderWater('eveningWater', WATER_SPLIT.evening, 'we_');

        let totalWater = 0, totalCups = 0;
        Object.keys(WATER_SPLIT).forEach(part => {
            const count = WATER_SPLIT[part];
            const prefix = part === 'morning' ? 'wm_' : part === 'day' ? 'wd_' : 'we_';
            for (let i = 1; i <= count; i++) { totalCups++; if (current.water && current.water[prefix + i]) totalWater++; }
        });
        document.getElementById('waterTotal').textContent = `💧 Всего воды: ${totalWater} из ${totalCups} стаканов`;

        const sleepRow = document.getElementById('sleepRow');
        sleepRow.innerHTML = '';
        SLEEP_OPTIONS.forEach(s => {
            const chip = document.createElement('span');
            chip.className = 'sleep-chip' + (current.sleep === s ? ' selected' : '');
            chip.textContent = s;
            chip.onclick = () => { setSleep(s); };
            sleepRow.appendChild(chip);
        });

        const feelRow = document.getElementById('feelRow');
        feelRow.innerHTML = '';
        FEEL_OPTIONS.forEach(f => {
            const chip = document.createElement('span');
            chip.className = 'feel-chip' + (current.feel === f ? ' selected' : '');
            chip.textContent = f;
            chip.onclick = () => { setFeel(f); };
            feelRow.appendChild(chip);
        });

        document.getElementById('weightInput').value = current.weight || '';
        document.getElementById('underbustInput').value = current.underbust || '';
        document.getElementById('waistInput').value = current.waist || '';
        document.getElementById('bellyInput').value = current.belly || '';
        document.getElementById('hipsInput').value = current.hips || '';
        document.getElementById('thighInput').value = current.thigh || '';

        const chartValues = [];
        const now = new Date();
        for (let i = 6; i >= 0; i--) {
            const c = new Date(now); c.setDate(now.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            chartValues.push((day && day.weight) ? day.weight : '—');
        }
        document.getElementById('chartValues').textContent = chartValues.join(' → ');

        document.getElementById('notesField').value = current.notes || '';
    }

    function saveAll() {
        const d = getDayData(selectedDate);
        d.weight = document.getElementById('weightInput').value.trim();
        d.underbust = document.getElementById('underbustInput').value.trim();
        d.waist = document.getElementById('waistInput').value.trim();
        d.belly = document.getElementById('bellyInput').value.trim();
        d.hips = document.getElementById('hipsInput').value.trim();
        d.thigh = document.getElementById('thighInput').value.trim();
        d.notes = document.getElementById('notesField').value.trim();
        save();
        render();
        showToast('💾 Сохранено!');
    }

    function exportReport() {
        saveAll();
        const lines = [];
        const d = new Date();
        for (let i = 6; i >= 0; i--) {
            const c = new Date(d); c.setDate(d.getDate() - i);
            const k = `${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;
            const day = data.days[k];
            const ds = c.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' });
            if (day && day.habits && Object.keys(day.habits).length > 0) {
                const total = ALL_HABITS.length;
                const done = Object.values(day.habits).filter(v=>v).length;
                lines.push(`📅 ${ds} — ${done}/${total} привычек`);
                ALL_HABITS.forEach(h => {
                    lines.push(`   ${day.habits[h.id] ? '✅' : '❌'} ${h.name}`);
                });
                if (day.sleep) lines.push(`   💤 Сон: ${day.sleep}`);
                if (day.feel) lines.push(`   😌 Самочувствие: ${day.feel}`);
                if (day.weight) lines.push(`   ⚖️ Вес: ${day.weight} кг`);
                if (day.underbust) lines.push(`   📏 Под грудью: ${day.underbust} см`);
                if (day.waist) lines.push(`   📏 Талия: ${day.waist} см`);
                if (day.belly) lines.push(`   📏 Живот: ${day.belly} см`);
                if (day.hips) lines.push(`   📏 Бёдра: ${day.hips} см`);
                if (day.thigh) lines.push(`   📏 Бедро: ${day.thigh} см`);
                if (day.photoDone) lines.push(`   📸 Фото сделано`);
                if (day.notes) lines.push(`   📝 ${day.notes}`);
            } else {
                lines.push(`📅 ${ds} — нет данных`);
            }
        }
        const txt = `🕊️ Отчёт Яны\nСвобода: ${document.getElementById('freedomDays').textContent} дней | 🔥 Серия: ${document.getElementById('streakCount').textContent}\n${'─'.repeat(20)}\n${lines.join('\n')}\n${'─'.repeat(20)}\n✨ Ты справляешься.`;
        navigator.clipboard.writeText(txt).then(() => showToast('📋 Отчёт скопирован!'));
    }

    function resetAll() {
        if (confirm('Удалить все данные?')) {
            localStorage.removeItem(STORAGE_KEY);
            data = { days: {}, lastPhotoDate: null };
            selectedDate = today;
            weekOffset = 0;
            render();
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('saveBtn').onclick = saveAll;
    document.getElementById('exportBtn').onclick = exportReport;
    document.getElementById('resetAllBtn').onclick = resetAll;
    document.getElementById('photoDoneBtn').onclick = markPhotoDone;

    render();
})();
</script>
</body>
</html>
